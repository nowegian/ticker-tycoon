<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticker Tycoon</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ticker Tycoon">
<meta name="theme-color" content="#0d1410">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1410; --panel:#142019; --panel2:#1b2a21; --line:#24382c;
  --ink:#e7f2ea; --dim:#8aa596; --green:#3ee08f; --red:#ff5d6c; --gold:#f6c453; --blue:#6cc4ff;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif; --pix:'Press Start 2P',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#070b09;color:var(--ink);font-family:var(--sans);height:100%}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#0d1410 88%,#0d141000);padding:12px 14px 8px}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand h1{font-family:var(--pix);font-size:12px;letter-spacing:1px;margin:0;color:var(--green)}
.brand .day{font-family:var(--mono);font-size:12px;color:var(--dim)}
.stats{display:grid;grid-template-columns:1fr 1fr 64px;gap:8px;margin-top:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.stat .v{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:2px}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:10px;font-family:var(--mono);font-size:11px;padding:5px 0}
.ticker span.t{display:inline-block;animation:scroll 50s linear infinite;padding-left:20%}
@keyframes scroll{to{transform:translateX(-100%)}}
main{flex:1;padding:4px 14px 150px}
.up{color:var(--green)} .down{color:var(--red)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:16px 0 8px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.due{display:flex;align-items:center;gap:10px;background:#2a2410;border:1px solid #5a4a18;border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.due.hot{background:#2e1418;border-color:#6a2430}
.due .em{font-size:24px}
.due .t{flex:1;font-size:13px;line-height:1.3}
.due .t b{display:block;font-size:14px}
.due .dl{font-family:var(--mono);font-size:13px;color:var(--gold);text-align:right;white-space:nowrap}
.due.hot .dl{color:var(--red)}
.paper{background:#f3ecd8;color:#1f1a10;border-radius:12px;padding:12px 14px;border:1px solid #d9cfb2}
.paper .mast{font-family:var(--pix);font-size:10px;text-align:center;border-bottom:2px solid #1f1a10;padding-bottom:8px;margin-bottom:6px}
.paper .sub{font-size:10px;text-align:center;margin-bottom:6px;color:#5c5340}
.headline{padding:8px 0;border-top:1px dashed #b8ad8f;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.headline:first-of-type{border-top:none}
.paper .tag{font-family:var(--mono);font-size:9px;font-weight:600;background:#1f1a10;color:#f3ecd8;padding:2px 5px;border-radius:3px;white-space:nowrap;margin-top:2px}
.paper .tag.rumor{background:#a8462e}
.paper .tag.mkt{background:#2c5a8a}
.headline .txt{font-family:Georgia,serif;font-size:15px;line-height:1.25;font-weight:700}
.headline .mv{font-family:var(--mono);font-size:11px;font-weight:600;margin-top:3px}
.headline .mv.up{color:#16784a}.headline .mv.down{color:#b3263a}
.row{display:grid;grid-template-columns:1fr 70px 88px;align-items:center;gap:8px;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:none}
.row:active,.npc:active{background:var(--panel2)}
.sym{font-family:var(--mono);font-weight:600;font-size:15px}
.nm{font-size:11px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px{text-align:right;font-family:var(--mono)}
.px .p{font-size:15px;font-weight:600}
.px .c{font-size:11px;margin-top:2px}
.own{display:inline-block;font-size:9px;font-family:var(--mono);background:var(--panel2);color:var(--gold);border:1px solid #4a4020;border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:2px}
.empty{padding:22px;text-align:center;color:var(--dim);font-size:14px}
#nextBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));width:calc(min(480px,100%) - 28px);
  z-index:6;border:none;border-radius:14px;padding:15px;font-family:var(--pix);font-size:12px;color:#06120b;background:var(--green);
  box-shadow:0 6px 0 #1e8a54,0 10px 24px #0008;cursor:pointer}
#nextBtn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #1e8a54}
#nextBtn:disabled{opacity:.4}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:6;background:#0a100c;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:none;color:var(--dim);padding:9px 0 11px;font-family:var(--sans);font-size:10.5px;font-weight:600;cursor:pointer;position:relative}
nav button .i{display:block;font-size:19px;margin-bottom:2px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--green)}
nav button.on .i{filter:none;opacity:1}
nav .dot{position:absolute;top:7px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--red)}
/* npcs */
.npc{display:flex;gap:12px;align-items:center;padding:12px;border-top:1px solid var(--line);cursor:pointer}
.npc:first-child{border-top:none}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex:none;border:2px solid #0006}
.npc .who{flex:1;min-width:0}
.npc .n{font-weight:700}
.npc .r{font-size:12px;color:var(--dim)}
.npc .q{font-size:13px;color:#cfe0d5;margin-top:4px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble{background:var(--panel2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:11px 13px;font-size:14.5px;line-height:1.45;margin:10px 0 12px}
.bubble b{color:var(--gold)}
.bubble b.up{color:var(--green)} .bubble b.down{color:var(--red)}
.opt{display:block;width:100%;text-align:left;margin-top:8px}
.opt small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:2px}
.prop{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prop:first-of-type{border-top:none}
.prop .em{font-size:26px;width:34px;text-align:center}
.prop .pt{flex:1;min-width:0;font-size:13px}
.prop .pt b{display:block;font-size:14px}
.prop .btn{padding:9px 12px;font-size:13px}
.hearts{font-size:15px;letter-spacing:2px}
/* sheet */
.scrim{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{width:100%;max-width:480px;background:var(--panel);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:none;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;animation:up .22s ease-out}
.modal{align-items:center}
.modal .sheet{border-radius:18px;margin:auto 14px;border-bottom:1px solid var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:-6px auto 12px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh-top .big{font-family:var(--mono);font-size:26px;font-weight:600}
canvas{width:100%;height:170px;display:block;margin:10px 0 6px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.meta > div{background:var(--panel2);border-radius:8px;padding:7px 8px}
.meta .k{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.meta .v{font-family:var(--mono);font-size:13px;margin-top:2px}
.qty{display:flex;gap:8px;align-items:center;margin:12px 0 6px}
.qty button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:20px;cursor:pointer}
.qty input{flex:1;height:46px;border-radius:10px;border:1px solid var(--line);background:#0b120e;color:var(--ink);font-family:var(--mono);font-size:20px;text-align:center;min-width:0}
.chips{display:flex;gap:6px;margin-bottom:10px}
.chips button{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:none;color:var(--dim);font-family:var(--mono);font-size:12px;cursor:pointer}
.est{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:center;margin-bottom:10px;min-height:16px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:none;border-radius:12px;padding:13px;font-family:var(--sans);font-weight:700;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.buy{background:var(--green);color:#06120b}
.sell{background:var(--red);color:#1a0508}
.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.gold{background:var(--gold);color:#241a02}
.blue{background:var(--blue);color:#04121c}
/* goals */
.goal{display:flex;gap:12px;align-items:center;padding:12px;border-top:1px solid var(--line)}
.goal:first-child{border-top:none}
.goal .em{font-size:26px;width:38px;text-align:center}
.goal .gt{flex:1;min-width:0}
.goal .gn{font-weight:700}
.goal .gd{font-size:12px;color:var(--dim);margin-top:2px}
.goal .gc{font-family:var(--mono);font-size:12.5px;margin-top:4px}
.goal.failed{opacity:.45}
.goal.failed .gn{text-decoration:line-through}
.goal .btn{padding:9px 12px;font-size:13px}
.bar{height:6px;background:#0b120e;border-radius:6px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
.story{font-size:14px;line-height:1.5;color:#cfe0d5}
.log{padding:10px 12px;border-top:1px solid var(--line);font-size:13px;line-height:1.35}
.log:first-child{border-top:none}
.log .d{font-family:var(--mono);font-size:10px;color:var(--dim)}
.log .o{font-family:var(--mono);font-size:12px;margin-top:3px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  padding:10px 14px;border-radius:10px;z-index:40;font-size:13px;max-width:90%;box-shadow:0 8px 24px #000a;animation:up .2s}
.small{font-size:12px;color:var(--dim);line-height:1.45}
.pixel{font-family:var(--pix);font-size:13px;line-height:1.6;color:var(--gold);text-align:center;margin:6px 0 12px}
ul.how{padding-left:18px;margin:8px 0;font-size:14px;line-height:1.5;color:#cfe0d5}
.strikes{font-size:14px}

/* ---- v3 additions ---- */
.prot{display:block;width:100%;text-align:left;background:#10222e;border:1px solid #24506a;color:var(--ink);border-radius:10px;padding:9px 11px;font-size:13px;margin:-2px 0 10px;cursor:pointer;font-family:var(--sans)}
.prot .pchg{float:right;color:var(--blue);font-weight:600}
.logf{display:flex;gap:6px;margin-bottom:8px}
.logf button{flex:1;padding:8px 0;border-radius:20px;border:1px solid var(--line);background:none;color:var(--dim);font-size:12px;font-weight:600;cursor:pointer}
.logf button.on{background:var(--panel2);color:var(--ink);border-color:#3a5444}
.lb{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;margin-right:6px;vertical-align:1px}
.buyb{background:#123524;color:var(--green)} .sellb{background:#3a1419;color:var(--red)}
.tnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px 0 10px}
.tnav button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 12px;font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer}
.tnav span{font-size:11px;color:var(--dim)}
.sheet.sl{animation:slL .22s ease-out} .sheet.sr{animation:slR .22s ease-out}
@keyframes slL{from{transform:translateX(40px);opacity:.3}} @keyframes slR{from{transform:translateX(-40px);opacity:.3}}
.rsv{font-size:10px;color:var(--blue);font-family:var(--mono);margin-top:1px;min-height:0}
.mcard{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid #2f5a42;border-radius:12px;padding:10px 12px;margin-top:8px}
.mbody{flex:1;min-width:0}
.mt{font-weight:700;font-size:14px;margin-bottom:5px}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.mchip{border-radius:20px;padding:5px 10px;font-size:12px;font-family:var(--mono);cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.mchip.cheap b{color:var(--green)} .mchip.pricey b{color:var(--red)}
.mbtn{width:100%;padding:9px;font-size:13px;margin-top:4px}
.mtip{font-size:12.5px;background:#221f12;border:1px solid #4a4020;border-radius:8px;padding:7px 9px;margin-top:4px;line-height:1.4}
.rep-row{padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.rep-row:first-child{border-top:none}
.rr1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rr2{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
.rr2 b{font-family:var(--mono);color:var(--ink)}
.rr2 b.up{color:var(--green)}.rr2 b.down{color:var(--red)}
.lotsell{display:flex;gap:6px;margin:6px 0 4px}
.lotsell input{flex:1;min-width:0;height:38px;border-radius:8px;border:1px solid var(--line);background:#0b120e;color:var(--ink);font-family:var(--mono);font-size:15px;text-align:center}
.lotsell .btn{padding:8px 12px;font-size:13px}
#olot{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:#0b120e;color:var(--ink);font-family:var(--sans);font-size:13px;padding:0 8px}
.meta .tap{cursor:pointer;border:1px solid #4a4020;background:#221f12}
.meta .tap .k{color:var(--gold)}
.tapnote{font-size:9px;color:var(--gold);margin-top:2px}
.lot{padding:10px 0;border-top:1px solid var(--line)}
.lot:first-child{border-top:none}
.lot.gone{opacity:.45}
.lot .lt{font-size:12px;color:var(--dim)}
.lot .lt b{color:var(--ink)}
.lot .via{float:right;font-size:10px;font-family:var(--mono);border:1px solid var(--line);border-radius:10px;padding:1px 6px}
.lot .lr{display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;margin:4px 0 2px}
.about{background:none;border:1px solid var(--line);color:var(--blue);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;margin-top:6px;cursor:pointer;font-family:var(--sans)}
.av.big{width:64px;height:64px;font-size:36px}
.story-who{display:flex;gap:14px;align-items:center;margin:6px 0 4px}
.story-text{font-size:16px;line-height:1.55;min-height:120px}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}
#tut{position:fixed;inset:0;z-index:60}
.tut-hole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.8);border:2px solid var(--gold);pointer-events:none;transition:all .25s}
.tut-card{position:fixed;left:12px;right:12px;max-width:456px;margin:0 auto;background:var(--panel);border:1.5px solid var(--gold);border-radius:14px;padding:14px;box-shadow:0 12px 30px #000c;animation:up .2s}
.tut-step{font-family:var(--pix);font-size:9px;color:var(--gold);margin-bottom:8px}
.tut-text{font-size:14.5px;line-height:1.5}
.tut-btns{display:flex;align-items:center;gap:8px;margin-top:12px}
.tut-btns .btn{padding:10px 16px;font-size:14px}
.tut-btns .lnk{background:none;border:none;color:var(--dim);font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0b120e;border:1px solid var(--line);border-radius:10px;padding:3px;margin:12px 0 10px}
.seg button{border:none;background:none;color:var(--dim);padding:9px 0;border-radius:8px;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--ink)}
.otypes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.otypes button{flex:1 1 30%;padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--dim);font-size:12px;font-weight:600;cursor:pointer}
.otypes button.buy.on{background:#123524;color:var(--green);border-color:#1e8a54}
.otypes button.sell.on{background:#3a1419;color:var(--red);border-color:#8a2a35}
.ord{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.ord:first-child{border-top:none}
.ord .ot{flex:1}
.ord .btn{padding:7px 10px;font-size:12px}
.art-h{font-family:Georgia,serif;font-size:21px;font-weight:700;line-height:1.2;margin-bottom:8px}
.art-b{font-family:Georgia,serif;font-size:15.5px;line-height:1.5;color:#2c2618}
.brk,.headline{cursor:pointer}
#ctrl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));width:calc(min(480px,100%) - 28px);z-index:6}
#ffBtn{flex:none;width:74px;border:none;border-radius:14px;font-size:22px;color:#04121c;background:var(--blue);box-shadow:0 6px 0 #2b6f99,0 10px 24px #0008;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#ffBtn small{font-family:var(--pix);font-size:8px;margin-top:4px}
#ffBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #2b6f99}
#openBtn{flex:1;width:100%;border:none;border-radius:14px;padding:15px;font-family:var(--pix);font-size:12px;color:#06120b;background:var(--green);box-shadow:0 6px 0 #1e8a54,0 10px 24px #0008;cursor:pointer}
#openBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #1e8a54}
#openBtn:disabled{opacity:.4}
#live{display:flex;gap:8px;align-items:stretch;background:#0a100c;border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 10px 24px #000a}
#live .clock{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 6px}
#clk{font-family:var(--pix);font-size:13px;color:var(--green)}
#live.paused #clk{color:var(--gold)}
.cbar{height:5px;background:var(--panel2);border-radius:5px;margin-top:7px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--green);width:0}
#live button{min-width:48px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;font-size:16px;font-family:var(--mono);font-weight:600;cursor:pointer}
#live #pauseBtn{background:var(--gold);color:#241a02;border:none;font-size:18px}
.race{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:8px;cursor:pointer}
.race .me,.race .vic{font-family:var(--mono);font-size:14px;font-weight:600}
.race .vic{text-align:right}
.race .lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-family:var(--sans);font-weight:500}

  H[ymd(nthWeekday(y,0,1,3))]='Martin Luther King Jr. Day';
  H[ymd(nthWeekday(y,1,1,3))]='Presidents’ Day';
  H[ymd(easter(y)-2*MS_DAY)]='Good Friday';
  H[ymd(lastWeekday(y,4,1))]='Memorial Day';

  H[ymd(observed(Date.UTC(y,6,4)))]='Independence Day';
  H[ymd(nthWeekday(y,8,1,1))]='Labor Day';
  H[ymd(nthWeekday(y,10,4,4))]='Thanksgiving';

function fillNews(tpl, s){
  const a=rnd(.8,3.5), b=a*rnd(.6,.85);
  return tpl.replace(/\{n\}/g, s?s.name:'').replace(/\{sec\}/g, s?s.sector.toLowerCase():'')

    .replace('${a}', '$'+a.toFixed(2)).replace('${b}', '$'+b.toFixed(2))
    .replace(/\$\$/g,'$');
}
// tone hints at whether the story will hold up: right about 2 times in 3
function toneLine(kind, holds){
  const sure = Math.random()<(holds?.84:.16);
  const k = kind==='rumor'?'rumor':kind==='co'?'co':kind==='brk'?'brk':'wide';
  return pick(TONE[sure?'sure':'shaky'][k]);
}
function writeArticle(it, tpl, s, kind){
  const holds = it.real!==undefined ? Math.sign(it.real)===it.sign : it.holds;
  it.blurb = fillNews(DETAILS[tpl]||'No further details were available at press time.', s) + ' ' + toneLine(kind||it.kind, holds);
  return it;
}

const pick = a => a[Math.floor(Math.random()*a.length)];

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function money(n, compact){
  const neg=n<0; n=Math.abs(n); let s;
  if(compact && n>=1e6) s='$'+(n/1e6).toFixed(n>=1e7?1:2)+'M';
  else if(compact && n>=1e4) s='$'+(n/1e3).toFixed(n>=1e5?0:1)+'K';
  else s='$'+n.toLocaleString('en-US',{minimumFractionDigits:n<100?2:0,maximumFractionDigits:n<100?2:0});
  return (neg?'-':'')+s;
}

// ---- juice ----
let AC;
function sfx(type){
  if(!S||!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq={bell:[[880,.14],[660,.14],[880,.3]],close:[[660,.14],[880,.14],[660,.3]],news:[[520,.07],[0,.04],[520,.07],[780,.14]],cash:[[1320,.05],[1760,.12]],goal:[[523,.1],[659,.1],[784,.1],[1047,.3]],bad:[[260,.18],[190,.32]],click:[[700,.03]]}[type];
    let t0=AC.currentTime;
    seq.forEach(([f,d])=>{ if(f){ const o=AC.createOscillator(), g=AC.createGain(); o.type='square'; o.frequency.value=f; g.gain.setValueAtTime(.05,t0); g.gain.exponentialRampToValueAtTime(.0005,t0+d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+d);} t0+=d; });
  }catch(e){}
}
// A light imitation of the NYSE's electric bell: an electromagnet hammer striking a small gong ~20 times a second,
// then a ring-out in a big hall. Several "metal" overtones (each fading at its own speed, a few slightly detuned
// so they shimmer), uneven hammer strikes, a tiny click per strike, and a soft echo.
let HALL=null;
function hallBuffer(ctx){
  if(HALL && HALL.sampleRate===ctx.sampleRate && HALL.ctx===ctx) return HALL.buf;
  const sec=1.8, len=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,len,ctx.sampleRate), pre=Math.floor(ctx.sampleRate*0.012);
  for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<len;i++){ const env=Math.pow(1-i/len,3.2)*(i<pre?i/pre:1); d[i]=(Math.random()*2-1)*env; } }
  HALL={ctx,sampleRate:ctx.sampleRate,buf:b}; return b;
}
function ringBell(){
  if(!S||!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const ctx=AC, t0=ctx.currentTime+0.02, vol=0.032, base=560+Math.random()*16;
    // signal path: bus -> highpass -> lowpass -> (dry + hall echo) -> out
    const out=ctx.createGain(); out.gain.value=vol; out.connect(ctx.destination);
    const bus=ctx.createGain(), hp=ctx.createBiquadFilter(), lp=ctx.createBiquadFilter();
    hp.type='highpass'; hp.frequency.value=160; lp.type='lowpass'; lp.frequency.value=5000;
    const dry=ctx.createGain(); dry.gain.value=1; const wet=ctx.createGain(); wet.gain.value=0.16;
    const conv=ctx.createConvolver(); conv.buffer=hallBuffer(ctx);
    bus.connect(hp).connect(lp); lp.connect(dry).connect(out); lp.connect(conv).connect(wet).connect(out);
    // a slight echo: repeats about a quarter second later, fading each time
    const dl=ctx.createDelay(1), fb=ctx.createGain(), ec=ctx.createGain(); dl.delayTime.value=0.26; fb.gain.value=0.1; ec.gain.value=0.09;
    lp.connect(dl); dl.connect(fb).connect(dl); dl.connect(ec).connect(out);
    // uneven hammer: strikes about 21 times a second with a little jitter, the first few a touch harder
    const strikes=[]; for(let k=0,t=t0; k<4; k++, t+=0.38*(1+(Math.random()-.5)*0.08)) strikes.push(t);
    const last=strikes[strikes.length-1];
    // [frequency ratio, loudness, how long it rings (s)]
    const partials=[[0.5,.14,2.2],[1,.5,1.7],[1.004,.18,1.6],[1.19,.22,1.3],[1.5,.16,1.1],[2.0,.32,1.0],[2.006,.1,.9],[2.52,.1,.6],[3.0,.08,.5],[4.2,.05,.3]];
    partials.forEach(([r,a,dec])=>{
      const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=base*r;
      g.gain.setValueAtTime(0,t0);
      strikes.forEach((ts,k)=>{ const hit=a*(0.85+Math.random()*0.3)*(k===0?1.1:1); g.gain.setValueAtTime(hit,ts); g.gain.setTargetAtTime(0,ts+0.003,dec/3.5); });
      o.connect(g).connect(bus); o.start(t0); o.stop(last+dec*2.5+0.1);
    });
    // a soft metallic tick for each hammer strike
    const len=Math.floor(ctx.sampleRate*0.012), nb=ctx.createBuffer(1,len,ctx.sampleRate), nd=nb.getChannelData(0);
    for(let i=0;i<len;i++) nd[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=1.2; bp.connect(bus);
    strikes.forEach(ts=>{ const n=ctx.createBufferSource(), ng=ctx.createGain(); ng.gain.value=0.5+Math.random()*0.15; n.buffer=nb; n.connect(ng).connect(bp); n.start(ts); });
  }catch(e){}
}
function buzz(ms){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} }
function confetti(){
  const bits=['🎉','💵','✨','🪙','🎊','💰'];
  for(let i=0;i<34;i++){ const d=document.createElement('div'); d.className='confetti'; d.textContent=pick(bits);
    d.style.left=Math.random()*100+'vw'; d.style.animationDelay=(Math.random()*.5)+'s'; d.style.fontSize=(14+Math.random()*16)+'px';

}

function finishNews(it){

  return it;
}
function makeNews(){
  const out=[]; const n=Math.random()<.25?2:(Math.random()<.6?3:4); const used=new Set();
  const fresh=()=>{ let s; do{ s=pick(S.stocks);}while(used.has(s.sym)); used.add(s.sym); return s; };
  for(let i=0;i<n;i++){

    if(r<.48){ const s=fresh(), tp=pick(sign>0?CO_POS:CO_NEG); it={kind:'co',sym:s.sym,tpl:tp,text:fillNews(tp,s),sign,mag:rnd(.035,.12),rel:.72}; }
    else if(r<.64){ const s=fresh(), tp=pick(sign>0?RUMOR_POS:RUMOR_NEG); it={kind:'rumor',sym:s.sym,tpl:tp,text:fillNews(tp,s),sign,mag:rnd(.05,.14),rel:.55}; }
    else if(r<.88){ const sec=pick(Object.keys(SECTOR_NEWS)), tp=pick(sign>0?SECTOR_NEWS[sec].pos:SECTOR_NEWS[sec].neg); it={kind:'sector',sector:sec,tpl:tp,text:tp,sign,mag:rnd(.02,.065),rel:.7}; }

}
const hits = (n,s) => (n.sym===s.sym) || (n.kind==='sector'&&n.sector===s.sector) || n.kind==='mkt';
const weight = (n,s) => n.kind==='mkt'? s.beta : 1;

// ================= THE TRADING DAY =================
function buildPath(s, target){
  const inc=[]; let cum=0;
  for(let i=1;i<=TICKS;i++){ cum+=gauss()*s.vol*.6/Math.sqrt(TICKS); inc.push(cum); }
  const lt=Math.log(target/s.price), end=inc[TICKS-1];
  s.path=[s.price];
  for(let i=1;i<=TICKS;i++) s.path.push(Math.max(.5,+(s.price*Math.exp(inc[i-1]-end*i/TICKS+lt*i/TICKS)).toFixed(2)));
}
function makeBreak(){
  if(Math.random()<.14){ const f=pick(FLASH), b={kind:'mkt',text:f.t,sign:f.s,mag:rnd(.035,.07),rel:.5}; b.holds=Math.random()<b.rel; return writeArticle(b,f.t,null,'brk'); }
  const s=pick(S.stocks), sign=Math.random()<.5?1:-1;
  const tp=pick(sign>0?BREAK_POS:BREAK_NEG), b={kind:'co',sym:s.sym,text:fillNews(tp,s),sign,mag:rnd(.04,.1),rel:.65}; b.holds=Math.random()<b.rel; return writeArticle(b,tp,s,'brk');
}
function openMarket(){
  if(isOpen()||S.over) return;
  if(S.queue.length){ showQueue(); return; }
  filledSyms.clear();
  S.dayStartNW=netWorth(); S.dayTrades=[]; S.dayStartQty={}; Object.entries(S.holdings).forEach(([k,v])=>S.dayStartQty[k]=v.qty);
  if(Math.random()<.035) S.mood=clamp(gauss()*.7,-1,1);
  S.stocks.forEach(s=>s.prev=s.price);
  // opening gap: part of each morning story is priced in at the bell
  S.news.forEach(n=>{ n.moves={}; S.stocks.forEach(s=>{ if(!hits(n,s)) return; const e=n.pre*weight(n,s)*rnd(.7,1.3); s.price=Math.max(.5,+(s.price*(1+e)).toFixed(2)); n.moves[s.sym]=e; }); });
  // where each stock will close (before any breaking news)
  S.stocks.forEach(s=>{
    let r = s.drift + S.mood*.005 + gauss()*s.vol*.8 - 0.02*Math.log(s.price/s.fair);
    S.news.forEach(n=>{ if(!hits(n,s)) return; const w=weight(n,s); r+=(n.real-n.pre)*w; s.fair*=1+n.real*w*.8; });
    s.fair=Math.max(1,s.fair*(1+s.drift)*Math.exp(gauss()*s.vol*.1));
    buildPath(s, Math.max(.5,s.price*Math.exp(clamp(r,-.45,.45))));
  });
  const k=Math.random()<.55?1:(Math.random()<.35?2:0);
  S.breakQ=[]; for(let i=0;i<k;i++) S.breakQ.push({t:Math.floor(rnd(4,MID-1)),b:makeBreak()});
  S.breaking=[]; S.t=0; S.phase='open'; paused=false; S.breakPaused=false;
  runOrders(true);
  save(); if(!ffing) ringBell(); buzz(40);
}
function fireBreak(item){
  const b=item.b, t=S.t, moves={};
  S.stocks.forEach(s=>{
    if(!(b.kind==='mkt'||b.sym===s.sym)) return;
    const w=b.kind==='mkt'?s.beta:1, e=b.sign*b.mag*w*rnd(.8,1.2);
    const cont=((b.holds!==undefined?b.holds:Math.random()<b.rel) ? b.sign*b.mag*rnd(0,.5) : -b.sign*b.mag*rnd(.3,.8))*w;
    for(let k=t;k<=TICKS;k++) s.path[k]=Math.max(.5,+(s.path[k]*(1+e)*(1+cont*(k-t)/(TICKS-t||1))).toFixed(2));
    s.price=s.path[t]; moves[s.sym]=e;
  });
  const mv=b.sym?moves[b.sym]:Object.values(moves).reduce((a,c)=>a+c,0)/Object.keys(moves).length;
  S.breaking.unshift({time:clockStr(t),text:b.text,sym:b.sym,move:mv,blurb:b.blurb});
  addLog(`BREAKING ${clockStr(t)}: ${b.text}`,'break',`${b.sym||'Market'} ${pct(mv)}`,mv>=0);
  if(b.sym && S.holdings[b.sym]) S.ffHeldBreak=b.sym;
  if(!ffing && !quietMorning){ toast(`🚨 ${b.text}`); sfx('news'); buzz([60,40,60]); }
}

function closeMarket(quiet){

  const dayPL=netWorth()-S.dayStartNW, avgRet=S.stocks.reduce((t,s)=>t+s.price/s.prev-1,0)/S.stocks.length;

    let o;

    else if(n.sector){ const ss=S.stocks.filter(s=>s.sector===n.sector); o=`${n.sector} day ${pct(ss.reduce((t,s)=>t+s.price/s.prev-1,0)/ss.length)}`; }
    else o=`Market day ${pct(avgRet)}`;
    S.log.unshift({day:S.day,text:n.text,kind:n.kind,out:o,good:!o.includes('-')});
  });
  const report=buildReport(dayPL,avgRet);
  S.day++;
  // splits
  S.stocks.forEach(s=>{
    if(s.price>400){
      s.price=+(s.price/2).toFixed(2); s.prev/=2; s.fair/=2; s.hist=s.hist.map(x=>+(x/2).toFixed(2));
      const h=S.holdings[s.sym]; if(h){ ensureLots(h); h.qty*=2; h.cost/=2; h.lots.forEach(l=>{l.qty*=2;l.left*=2;l.price/=2;}); (h.sells||[]).forEach(x=>{x.qty*=2;x.price/=2;}); }
      addLog(`${s.name} announces a 2-for-1 stock split`,'co','Shares doubled, price halved',true);
    }
  });
  if(newMonth(S.day)) payBills();
  if(newWeek(S.day)) S.hearts=Math.max(0,S.hearts-2);
  S.closedNote=S.day>0?closedBetween(S.day-1,S.day):[];
  S.news=S.next; S.next=makeNews();
  morningRead();
  updateRival(avgRet);
  resolvePending();
  checkGoals();
  maybeEvent();
  coverCash(newMonth(S.day)?'this month’s bills':'today’s costs');
  if(!S.over && netWorth()<-25000) S.over='bankrupt';
  if(!S.over && S.rival.nw>=ISLAND && !S.items.includes('island')) S.over='rival';
  if(report){ S.lastReport=report; if(S.showReport!==false && !skipReport) S.queue.unshift({type:'report'}); }
  save();
  if(quiet) return;
  render(); window.scrollTo(0,0);
  ringBell();   // the NYSE rings the same bell at the close
  toast(`🔔 Closing bell · ${dayPL>=0?'+':''}${money(dayPL,true)} today`);
  if(S.over) showEnd();
  else if(S.queue.length) setTimeout(showQueue,500);
  else if(sheetSym) openTrade(sheetSym);
  else if(sheetNpc) openNpc(sheetNpc);
}
let skipReport=false;
function buildReport(dayPL, avgRet){
  const T=S.dayTrades||[], q0=S.dayStartQty||{};
  const syms=[...new Set([...Object.keys(S.holdings), ...Object.keys(q0), ...T.map(t=>t.sym)])];
  if(!syms.length) return null;
  const rows=syms.map(sym=>{
    const s=stock(sym), h=S.holdings[sym], qE=h?h.qty:0, start=q0[sym]||0;
    const buys=T.filter(t=>t.sym===sym&&t.side==='buy'), sells=T.filter(t=>t.sym===sym&&t.side==='sell');
    const bought=buys.reduce((a,t)=>a+t.qty*t.price,0), sold=sells.reduce((a,t)=>a+t.qty*t.price,0);
    const fees=(buys.length+sells.length)*COMMISSION;
    return {sym, name:s.name, qty:qE, close:s.price, chg:s.price/s.prev-1,
      dayPL: qE*s.price - start*s.prev + sold - bought - fees,
      value: qE*s.price, total: h?(s.price-h.cost)*qE:0, totalPct: h?s.price/h.cost-1:0,
      boughtQty:buys.reduce((a,t)=>a+t.qty,0), soldQty:sells.reduce((a,t)=>a+t.qty,0), realized:sells.reduce((a,t)=>a+(t.gain||0),0)};
  }).sort((a,b)=>b.value-a.value);
  return {day:S.day, rows, dayPL, nw:netWorth(), nwStart:S.dayStartNW, cash:S.cash, market:avgRet};
}

function nextBillDay(){ let d=S.day+1; while(d<DEADLINE && !newMonth(d)) d++; return d; }
function payBills(){
  const bill=monthlyBills();
  S.cash-=bill;
  S.props.forEach(p=>{
    if(p.owned && p.loan>0){ const int=p.loan*MORT_RATE; p.loan=Math.max(0,p.loan-(p.pay-int)); }
    p.value=Math.round(p.value*(1+.004+gauss()*.025));
  });
  addLog(`Paid monthly bills`,'bill',money(bill),false);
}
function checkGoals(){
  const nw=netWorth();
  GOALS.forEach(g=>{
    if(goalState(g)) return;
    let done=false;
    if(g.type==='nw') done=nw>=g.target;
    if(g.type==='home') done=ownsHome();
    if(g.type==='prop') done=propS(g.prop).owned;
    if(g.type==='buy') done=S.items.includes(g.id);
    if(done && S.day<=g.due){ S.goals[g.id]='done'; addLog(`Goal complete: ${g.name}`,'goal','✓',true,g.by); toast(`🏆 Goal complete: ${g.name}`); confetti(); sfx('goal'); S.unread.whitlock=true; return; }
    if(S.day>g.due){
      S.goals[g.id]='failed';
      if(g.final){ S.over='deadline'; return; }
      if(g.by==='jordan') S.hearts=Math.max(0,S.hearts-25);
      if(S.goodwill>0){ S.goodwill--; addLog(`Missed: ${g.name} — forgiven thanks to your goodwill`,'strike','No strike',true,'whitlock'); notice('whitlock','A deadline forgiven',`You missed <b>${g.name}</b>. Normally that’s a strike — but your generosity at Edna’s gala bought you some goodwill. Just this once.`); return; }
      S.strikes++;
      addLog(`Missed deadline: ${g.name} — strike ${S.strikes} of ${MAX_STRIKES}`,'strike','Strike!',false,'whitlock');
      notice('whitlock',`Strike ${S.strikes}`,`You missed the deadline for <b>${g.name}</b>. That’s strike ${S.strikes} of ${MAX_STRIKES}.${S.strikes===MAX_STRIKES-1?' <b>One more and the will is void.</b>':''}`);
      sfx('bad'); S.unread.whitlock=true;
      if(S.strikes>=MAX_STRIKES) S.over='strikes';
    }
  });
}

function updateRival(avgRet){
  const R=S.rival, me=netWorth();
  const aggressive = me > R.nw*1.3 ? 1.6 : 1;           // he takes bigger risks when he's losing
  R.nw = Math.max(20000, R.nw*(1 + avgRet*.6 + .0031 + gauss()*.015*aggressive));
  const lead = me>=R.nw ? 'me' : 'him';
  if(R.lead && lead!==R.lead){
    if(lead==='me') toast('😼 You just passed Victor!'); else toast('🦹 Victor has pulled ahead of you');
    S.unread.victor=true;
  }
  R.lead=lead;
  // sabotage: badmouth your biggest position in tomorrow's paper
  const hs=Object.entries(S.holdings);
  if(hs.length && S.day>5 && Math.random()<.05){
    const [sym]=hs.sort((a,b)=>b[1].qty*stock(b[0]).price-a[1].qty*stock(a[0]).price)[0], s=stock(sym);
    S.next.push(finishNews({kind:'rumor',sym,tpl:'Anonymous tipster claims {n} is hiding big losses',text:`Anonymous tipster claims ${s.name} is hiding big losses`,sign:-1,mag:rnd(.12,.25),rel:.4}));
    addLog(`Victor is spreading rumors about ${sym}`,'rival','',false,'victor');
    notice('victor','Watch your back',`Word is I’ve been chatting with some reporters about <b>${s.name}</b>. Shame if your favorite stock tanked tomorrow, cousin. 😈`);
    S.unread.victor=true;
  }
}

function maybeEvent(){
  if(S.over || S.day-S.lastEvent<5 || Math.random()>.2) return;
  const pool=Object.entries(EVENTS).filter(([id,e])=>!(e.once&&S.seen[id]) && e.cond());
  if(!pool.length) return;
  let tot=pool.reduce((t,[,e])=>t+e.w,0), r=Math.random()*tot, chosen=pool[0];
  for(const p of pool){ r-=p[1].w; if(r<=0){ chosen=p; break; } }
  const [id,e]=chosen; S.seen[id]=true; S.lastEvent=S.day;
  S.queue.push({type:'event',id,d:e.data()});
}
function notice(who,title,text){ S.queue.push({type:'notice',who,title,text}); }
function resolvePending(){
  const due=S.pending.filter(p=>p.day<=S.day); S.pending=S.pending.filter(p=>p.day>S.day);
  due.forEach(p=>{

      if(r<.2){ const pay=p.d.amt*10; S.cash+=pay; notice('dev','Dev’s app is a HIT!',`A tech giant just bought Dev’s company. Your share: <b>${money(pay)}</b>. Dev is crying. You might be too.`); confetti(); sfx('goal'); }

      else notice('dev','Dev’s app shut down',`“We were ahead of our time,” says Dev. Your ${money(p.d.amt)} is gone.`);

    if(p.type==='carbreak'){ spend(p.d.amt); notice('jordan','The car died',`Should have fixed that noise. The engine is toast — <b>${money(p.d.amt)}</b> to replace it.`); }

  });

// margin call: if cash drops below zero, sell just enough shares (biggest position first) to get back to zero
function coverCash(reason){
  if(S.cash>=0 || !Object.keys(S.holdings).length) return;
  const start=S.cash, sold=[]; let guard=0;
  while(S.cash<0 && guard++<24){
    const hs=Object.entries(S.holdings).map(([k,v])=>({sym:k,val:v.qty*stock(k).price})).sort((a,b)=>b.val-a.val);

function execSell(sym,q,via,alloc){
  const s=stock(sym), h=ensureLots(S.holdings[sym]);

  if(alloc){ alloc.forEach(a=>{ const lot=h.lots[a.i], take=Math.min(lot.left,a.qty); lot.left-=take; gain+=(s.price-lot.price)*take; }); }

  h.sells.push({day:S.day,time:tradeTime(),qty:q,price:s.price,via:via||'Sold',from:alloc?alloc.map(a=>a.i+1):null});

}

const OTYPES = {
  obuy: {label:'Buy at open',  side:'buy',  price:false, closedOnly:true, desc:'Buys as soon as the opening bell rings — at whatever the opening price is.'},
  osell:{label:'Sell at open', side:'sell', price:false, closedOnly:true, desc:'Sells as soon as the opening bell rings — at whatever the opening price is.'},
  limit:{label:'Limit buy',    side:'buy',  price:true,  desc:'Buys automatically if the price drops to your number or lower.'},
  tp:   {label:'Take profit',  side:'sell', price:true,  desc:'Sells automatically if the price rises to your target or higher.'},

function orderText(o){
  const q=o.qty.toLocaleString();

  return {obuy:`Buy ${q} at the open`, osell:`Sell ${q}${from} at the open`, limit:`Buy ${q} if ≤ ${money(o.price)}`, tp:`Sell ${q}${from} if ≥ ${money(o.price)}`, stop:`Stop-loss: sell ${q}${from} if ≤ ${money(o.price)}`}[o.type];

function runOrders(atOpen){
  if(!S.orders||!S.orders.length) return;
  const keep=[];
  for(const o of S.orders){
    const s=stock(o.sym), p=s.price; let fire=false;
    if(o.type==='obuy'||o.type==='osell') fire=atOpen;
    else if(o.type==='limit') fire=p<=o.price;
    else if(o.type==='tp') fire=p>=o.price;
    else if(o.type==='stop') fire=p<=o.price;
    if(!fire){ keep.push(o); continue; }
    fillOrder(o);
  }
  // one-cancels-the-other: once a sell order empties a position, drop the other sell orders on it
  const out=new Set([...filledSyms].filter(sym=>!S.holdings[sym]));
  S.orders=keep.filter(o=>!(out.has(o.sym) && OTYPES[o.type].side==='sell' && (addLog(`Canceled ${o.sym} order (position closed): ${orderText(o)}`,'order','',false),true)));

  const s=stock(o.sym), T=OTYPES[o.type]; filledSyms.add(o.sym);

    execBuy(o.sym,q,T.label);

  } else {
    const hh=S.holdings[o.sym]; if(hh) ensureLots(hh);
    const lotObj = hh && o.lot!=null ? hh.lots[o.lot] : null;
    const held = lotObj ? lotObj.left : (hh?.qty||0), q=Math.min(o.qty,held);
    if(q<1){ addLog(`Order canceled — no shares to sell: ${o.sym} ${T.label}`,'order','',false); toast(`📋 ${o.sym} ${T.label} canceled — no shares`); return; }
    const gain=execSell(o.sym,q,T.label, lotObj?[{i:o.lot,qty:q}]:null);

function buyProp(id){
  const p=propS(id), down=p.value*(DOWN+CLOSING); if(p.owned||S.cash<down) return;
  S.cash-=down; p.owned=true; p.loan=p.value*(1-DOWN); p.pay=Math.round(p.loan*MORT_PAY);
  addLog(`Bought ${propD(id).name} with a mortgage`,'prop',`${money(down)} down`,true,'ray');
  toast(`🔑 ${propD(id).name} is yours!`); checkGoals(); save(); render(); openNpc('ray');
}
function sellProp(id){
  const p=propS(id); if(!p.owned) return;
  const net=p.value*.95-p.loan; S.cash+=net; p.owned=false; p.loan=0; p.pay=0;
  addLog(`Sold ${propD(id).name}`,'prop',money(net),net>=0,'ray'); toast(`Sold ${propD(id).name}`); save(); render(); openNpc('ray');
}
const tipCost = () => Math.max(1000, Math.round(netWorth()*0.015/100)*100);
function buyTip(stay){
  if(S.tipDay===S.day||S.martyBan>S.day) return; const c=tipCost(); if(S.cash<c) return toast('Not enough cash');
  S.cash-=c; S.tipDay=S.day; S.tipsBought++;
  const cands=S.next.filter(n=>n.kind!=='mkt'); const n=cands.length?pick(cands):S.next[0];
  const dir=Math.random()<0.62?n.sign:-n.sign;
  const subj = n.sym? `<b>${n.sym}</b>` : n.sector? `<b>${n.sector}</b> stocks` : `<b>the whole market</b>`;
  S.tipShort={sym:n.sym||null, sector:n.sym?null:(n.sector||null), good:dir>0, rumor:n.kind==='rumor'};
  S.tip = `Keep this between us, kid. <b>Tomorrow’s</b> paper is gonna have news on ${subj} — and it’s ${dir>0?'<b class="up">good</b>':'<b class="down">bad</b>'}. ${n.kind==='rumor'?'Could be just a rumor, though.':'My guy is usually right.'} Get in before today’s closing bell.`;
  addLog(`Paid Marty for a tip`,'tip',money(c),false,'marty');
  save(); render(); if(!stay) openNpc('marty');
}
// Marty's read is ready automatically every morning
function morningRead(){ if(S && !S.over && S.martyBan<=S.day && S.readDay!==S.day) freeRead('silent'); }
function freeRead(stay){
  S.readDay=S.day;
  const r=S.stocks.map(s=>({s,v:s.price/s.fair*Math.exp(gauss()*.08)})).sort((a,b)=>a.v-b.v); // Marty is good, not perfect
  const picks=r.slice(0,2).map(x=>({sym:x.s.sym, gap:Math.round((1-x.v)*100)})).filter(p=>p.gap>=3);
  const top=r[r.length-1], hot={sym:top.s.sym, gap:Math.round((top.v-1)*100)};
  S.readPicks={day:S.day, picks, hot};
  const badNews=sym=>{ const st=stock(sym); return S.news.find(n=>n.sign<0 && (n.sym===sym || (n.kind==='sector'&&n.sector===st.sector) || n.kind==='mkt')); };
  const lines=picks.map(p=>{ const b=badNews(p.sym);
    return `<b>${p.sym}</b> looks about <b>${p.gap}% underpriced</b>.${b?` <span class="down">Careful: ${b.kind==='mkt'?'the whole market has':b.sym?'it has':'its sector has'} bad news in this morning’s paper. I’d wait a day or two.</span>`:''}`; });
  S.read=`Here’s my read. ${lines.length?lines.join(' '):'Nothing looks really cheap today. Everything is close to fair value.'}
    ${lines.length?' Cheap stocks usually <b>drift back up over a few weeks</b>, not overnight, and the ride can be bumpy. Spread your money and be patient.':''}
    ${hot.gap>=3?` <b>${hot.sym}</b> looks about ${hot.gap}% <b>overpriced</b>. I wouldn’t chase it.`:''}
    ${S.mood>.3?' Overall the market’s feeling bullish.':S.mood<-.3?' Overall the market’s nervous, so careful out there.':' Overall the market’s pretty calm.'}`;
  if(stay==='silent') return;
  save(); if(stay) render(); else openNpc('marty');
}
function dinner(){ const c=800; if(S.cash<c||S.dinnerDay===S.day) return; S.cash-=c; S.dinnerDay=S.day; S.hearts=Math.min(100,S.hearts+12); addLog('Dinner date with Jordan','date',money(c),true,'jordan'); toast('💞 Lovely evening with Jordan'); save(); render(); openNpc('jordan'); }

function spark(h,w=70,ht=26){
  const d=h.slice(-30), mn=Math.min(...d), mx=Math.max(...d), rg=mx-mn||1;
  const pts=d.map((v,i)=>`${(i/(d.length-1)*w).toFixed(1)},${(ht-2-(v-mn)/rg*(ht-4)).toFixed(1)}`).join(' ');
  const col=d[d.length-1]>=d[0]?'var(--green)':'var(--red)';
  return `<svg width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

  if(id==='delia') return S.loan?`“Your balance is ${money(S.loan,true)}. Interest is due monthly.”`:`“You qualify for up to ${money(creditAvail(),true)}.”`;
  if(id==='ray') return ownsHome()?'“How’s the new place treating you?”':'“Still renting? Let’s fix that.”';
  if(id==='whitlock'){ const g=openGoals().sort((a,b)=>a.due-b.due)[0]; return g?`“${g.name}: due ${fmtDate(g.due)}.”`:'“Your affairs appear to be in order.”'; }

function openArticle(ref){
  sheetSym=null; sheetNpc=null;
  const brk=ref[0]==='b', n=brk?S.breaking[+ref.slice(1)]:S.news[+ref.slice(1)]; if(!n) return;
  const syms = n.sym?[n.sym] : n.sector? S.stocks.filter(s=>s.sector===n.sector).map(s=>s.sym) : [];
  let tag = brk? `<span class="tag rumor">🚨 BREAKING · ${n.time}</span>` : newsTag(n);
  const moveLine = sym=>{ const s=stock(sym), c=chg(s); return `<button class="btn ghost opt" data-sym="${sym}" data-from="art"><span class="sym">${sym}</span> &nbsp;${money(s.price)} <span class="${cls(c)}" style="font-family:var(--mono)">${pct(c)}</span><small>${esc(s.name)} — tap to trade</small></button>`; };
  openSheet(`<div class="paper" style="margin-top:4px"><div class="mast">THE EXCHANGE DAILY</div>
      <div class="sub">Day ${S.day+1}${brk?' · '+n.time:' · Morning Edition'}</div>
      <div style="margin:8px 0 6px">${tag}</div>
      <div class="art-h">${esc(n.text)}</div>
      <div class="art-b">${esc(n.blurb||'No further details were available at press time.')}</div></div>
    ${syms.length?`<h2>${syms.length>1?'Stocks in this story':'The stock'}</h2>${syms.map(moveLine).join('')}`:'<p class="small" style="margin-top:12px">This story affects the whole market — some stocks more than others.</p>'}
    ${isOpen()?'':'<p class="small">The market is closed. Trading opens at 9:30 AM.</p>'}
    <button class="btn ghost" style="width:100%;margin-top:12px" data-act="close">Close</button>`);
}
function martyHint(sym){
  const R=S.readPicks; if(!R||R.day!==S.day) return '';
  const p=R.picks.find(x=>x.sym===sym);
  if(p) return `<div class="bubble" style="margin:10px 0 0;font-size:13px;border-color:#3b6b4f">🧔 <b>Marty today:</b> about ${p.gap}% underpriced. These usually recover over a few weeks.${S.news.some(n=>n.sign<0&&(n.sym===sym||(n.kind==='sector'&&n.sector===stock(sym).sector)))?' <span class="down">But there’s bad news about it this morning, so he’d wait.</span>':''}</div>`;
  if(R.hot.sym===sym && R.hot.gap>=3) return `<div class="bubble" style="margin:10px 0 0;font-size:13px;border-color:#6a2430">🧔 <b>Marty today:</b> about ${R.hot.gap}% overpriced. He wouldn’t chase it.</div>`;
  return '';
}

function defaultOrderPrice(s){
  const h=S.holdings[s.sym];
  if(orderType==='limit') return (s.price*.95).toFixed(2);
  if(orderType==='tp') return (Math.max(s.price,h?h.cost:0)*1.1).toFixed(2);
  if(orderType==='stop') return (s.price*.9).toFixed(2);
  return s.price.toFixed(2);
}
function updateTradeLive(){
  const s=stock(sheetSym), h=S.holdings[sheetSym], c=chg(s), hn=histNow(s);
  const wk=hn.length>6?s.price/hn[hn.length-6]-1:0;
  $('#tPrice').textContent=money(s.price);
  $('#tChg').innerHTML=`<span class="${cls(c)}">${pct(c)} today</span>`;
  $('#t5').innerHTML=`<span class="${cls(wk)}">${pct(wk)}</span>`;
  $('#tVal').textContent=h?money(h.qty*s.price,true):'—';
  $('#tGain').innerHTML=h?`<span class="${cls(s.price-h.cost)}">${money((s.price-h.cost)*h.qty,true)}</span>`:'—';
  drawChart(s); updEst();
}
function updEst(){
  const s=stock(sheetSym); if(!s||!$('#q')) return; const q=Math.floor(+$('#q').value||0), h=S.holdings[s.sym];
  if($('#placeB')){
    const T=OTYPES[orderType], pr=T.price?+$('#op').value:s.price;
    $('#est').textContent = q>0 ? (T.side==='buy'?`≈ ${money(q*pr)} if it fills (+${money(COMMISSION)} fee)`:`You own ${(h?.qty||0).toLocaleString()} — sells up to ${q.toLocaleString()}`) : (T.side==='buy'?`You can afford about ${maxBuyAvail(s,pr).toLocaleString()} at that price (${money(Math.max(0,availCash()),true)} available)`:`You own ${(h?.qty||0).toLocaleString()} shares`);
    $('#placeB').disabled=!(q>0)||(T.price&&!(pr>0))||!!S.over||(T.side==='buy'&&q*pr+COMMISSION>availCash());
    return;
  }
  $('#est').textContent = q>0 ? `${q.toLocaleString()} × ${money(s.price)} = ${money(q*s.price)}  (+${money(COMMISSION)} fee) · ${money(Math.max(0,availCash()-q*s.price-COMMISSION),true)} left` : `${money(Math.max(0,availCash()),true)} available · max ${maxBuyAvail(s).toLocaleString()}`;
  $('#buyB').disabled=!(q>0&&q*s.price+COMMISSION<=availCash())||!!S.over;
  $('#sellB').disabled=!(q>0&&h&&h.qty>=q)||!!S.over;
}
function drawChart(s){
  const cv=$('#chart'); if(!cv) return; const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  cv.width=w*dpr; cv.height=h*dpr; const x=cv.getContext('2d'); x.scale(dpr,dpr);
  const open=isOpen();
  // when the market is open, show today's intraday path on the right third
  const daily=s.hist.slice(-60), intra=open?s.path.slice(0,S.t+1):[];
  const all=[...daily,...intra], mn=Math.min(...all), mx=Math.max(...all), rg=mx-mn||1, pad=8;
  const split=open?w*.62:w, Y=v=>pad+(1-(v-mn)/rg)*(h-pad*2);
  const col=s.price>=prevClose(s)?'#3ee08f':'#ff5d6c';
  x.strokeStyle='#24382c'; x.lineWidth=1; for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke();}
  const line=(d,x0,x1,n)=>{ x.beginPath(); d.forEach((v,i)=>{const X=x0+i/((n||d.length)-1)*(x1-x0); i?x.lineTo(X,Y(v)):x.moveTo(X,Y(v));}); };
  const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,col+'40'); g.addColorStop(1,col+'00');
  line(daily,0,split); x.lineTo(split,h); x.lineTo(0,h); x.closePath(); x.fillStyle=g; x.fill();
  line(daily,0,split); x.strokeStyle=open?'#5d7a68':col; x.lineWidth=2; x.lineJoin='round'; x.stroke();
  if(open){
    x.setLineDash([2,3]); x.strokeStyle='#3a5444'; x.beginPath(); x.moveTo(split,0); x.lineTo(split,h); x.stroke(); x.setLineDash([]);
    if(intra.length>1){ line(intra,split,w,TICKS+1); x.strokeStyle=col; x.lineWidth=2; x.stroke(); }
    const lx=split+(intra.length-1)/TICKS*(w-split); x.fillStyle=col; x.beginPath(); x.arc(lx,Y(s.price),3.5,0,7); x.fill();
    x.fillStyle='#8aa596'; x.font='10px IBM Plex Mono'; x.fillText('TODAY',split+4,11);
  }
  const hd=S.holdings[s.sym];
  if(hd&&hd.cost>=mn&&hd.cost<=mx){x.setLineDash([4,4]);x.strokeStyle='#f6c453';x.lineWidth=1;x.beginPath();x.moveTo(0,Y(hd.cost));x.lineTo(w,Y(hd.cost));x.stroke();x.setLineDash([]);x.fillStyle='#f6c453';x.font='10px IBM Plex Mono';x.fillText('your avg',4,Y(hd.cost)-4);}
  x.fillStyle='#8aa596'; x.font='10px IBM Plex Mono'; x.fillText('60 days',4,11);
}

function openProfile(sym){
  const s=stock(sym), P=PROFILES[sym]; sheetSym=null; sheetNpc=null;
  const vol=s.vol>.06?'Wild':s.vol>.04?'High':s.vol>.03?'Medium':'Low';
  const sens=P.beta>=1.3?'Very high':P.beta>=1.05?'High':P.beta>=.8?'Average':P.beta>=.5?'Low':'Very low';
  const c=chg(s);
  openSheet(`<div class="sh-top" style="align-items:center"><div style="display:flex;gap:12px;align-items:center"><div class="av big" style="background:var(--panel2)">${P.em}</div>
      <div><div class="sym" style="font-size:20px">${s.sym}</div><div class="nm" style="font-size:13px">${esc(s.name)}</div></div></div>
      <div style="text-align:right"><div class="big" style="font-size:20px">${money(s.price)}</div><div class="${cls(c)}" style="font-family:var(--mono);font-size:12px">${pct(c)} today</div></div></div>
    <div class="meta" style="margin-top:12px">
      <div><div class="k">Sector</div><div class="v">${s.sector}</div></div>
      <div><div class="k">Founded</div><div class="v">${P.founded}</div></div>
      <div><div class="k">CEO</div><div class="v" style="font-size:12px">${esc(P.ceo)}</div></div>
    </div>
    <div class="small" style="margin:2px 0 10px">📍 ${esc(P.hq)}</div>
    <div class="bubble" style="font-size:14.5px">${P.story.map(t=>`<p style="margin:0 0 8px">${t}</p>`).join('')}</div>
    <h2>What moves this stock</h2>
    <ul class="how" style="margin-top:0">${P.moves.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>
    <div class="meta" style="grid-template-columns:1fr 1fr">
      <div><div class="k">Daily swings</div><div class="v">${vol}</div></div>
      <div><div class="k">Reacts to market news</div><div class="v">${sens}</div></div>
    </div>
    <button class="btn buy" style="width:100%;margin-top:10px" data-sym="${sym}" data-from="art">Trade ${sym}</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" data-act="close">Close</button>`);
}

function showStory(i){
  const p=STORY[i], n=p.who?NPCS[p.who]:null;
  const dots=STORY.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');
  openSheet(`${i===0?'<div class="pixel" style="font-size:15px;margin-top:10px">TICKER TYCOON</div>':''}
    ${n?`<div class="story-who"><div class="av big" style="background:${n.bg}">${n.em}</div><div><div style="font-weight:700;font-size:18px">${n.name}</div><div class="small">${n.role}</div></div></div>`:'<div style="font-size:54px;text-align:center;margin:8px 0">✉️</div>'}
    <div class="bubble story-text">${p.text}</div>
    <div class="dots">${dots}</div>
    ${p.last?`<button class="btn buy" style="width:100%;margin-top:4px" data-act="tutstart">Show me how to play</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" data-act="tutno">Skip the tutorial</button>`
    :`<div class="acts" style="margin-top:4px">${i?`<button class="btn ghost" data-story="${i-1}">Back</button>`:`<button class="btn ghost" data-act="storyskip">Skip story</button>`}<button class="btn buy" data-story="${i+1}">Next ›</button></div>`}`, true);
}
function finishStory(){ S.storySeen=true; S.intro=false; save(); }

function startTutorial(){ tutOn=true; tutI=0; stopTimer(); showTut(); }
function showTut(){
  const st=TUT[tutI]; if(st.setup) st.setup();
  setTimeout(()=>{
    let el=document.querySelector(st.sel); if(el&&st.hl==='parent') el=el.parentElement;
    if(el) el.scrollIntoView({block:'center'});
    setTimeout(()=>placeTut(el,st),80);
  }, st.setup?300:40);
}
function placeTut(el,st){
  let ov=$('#tut'); if(!ov){ ov=document.createElement('div'); ov.id='tut'; document.body.appendChild(ov); }
  const H=window.innerHeight, pad=6;
  const r=el?el.getBoundingClientRect():{top:H/2,left:20,width:0,height:0,bottom:H/2};
  const top=Math.max(4,r.top-pad), bot=Math.min(H-4,r.bottom+pad);
  const roomBelow=H-bot, roomAbove=top;
  const pos = roomBelow>=roomAbove ? `top:${bot+10}px` : `bottom:${H-top+10}px`;
  ov.innerHTML=`<div class="tut-hole" style="top:${top}px;left:${r.left-pad}px;width:${r.width+pad*2}px;height:${bot-top}px"></div>
    <div class="tut-card" style="${pos}"><div class="tut-step">HOW TO PLAY · ${tutI+1} of ${TUT.length}</div><div class="tut-text">${st.text}</div>
    <div class="tut-btns"><button data-tut="skip" class="lnk">Skip tutorial</button><span style="flex:1"></span>${tutI?'<button data-tut="back" class="btn ghost">Back</button>':''}<button data-tut="next" class="btn buy">${tutI===TUT.length-1?'Finish':'Next ›'}</button></div></div>`;
}
function endTut(){
  tutOn=false; $('#tut')?.remove(); if($('#q')) $('#q').value=''; closeSheet();
  tradeMode='now'; orderType='obuy'; tab='market'; S.tutDone=true; save(); render(); window.scrollTo(0,0);
  toast('Tap 🔔 Open the market when you’re ready!');
}
function tutNav(k){
  if(k==='skip') return endTut();
  tutI += k==='next'?1:-1;
  if(tutI>=TUT.length) return endTut();
  showTut();
}

// ================= EVENTS =================
document.addEventListener('click',e=>{
  if(e.target.closest('#tut')){ const b=e.target.closest('[data-tut]'); if(b) tutNav(b.dataset.tut); return; }
  if(e.target.id==='scrim'){ if($('.story-text')) return; if(S.queue.length&&$('[data-choice],[data-act=ack]')) return; closeSheet(); return; }
  const t=e.target.closest('[data-tab],[data-sym],[data-goal],[data-act],[data-q],[data-qset],[data-qadd],[data-npc],[data-borrow],[data-repay],[data-buyprop],[data-sellprop],[data-choice],[data-story],[data-about],[data-prot],[data-protk],[data-protsave],[data-logf],[data-swipe],[data-lots],[data-lotsell],[data-lotmax],[data-pkmax],#pkGo,[data-art],[data-tmode],[data-otype],[data-pp],[data-cancel],#buyB,#sellB,#placeB');
  if(!t) return; const d=t.dataset;
  if(d.choice){ answerEvent(d.choice); return; }
  if(d.story){ showStory(+d.story); return; }
  if(d.swipe){ swipeTo(+d.swipe); return; }
  if(d.logf){ logFilter=d.logf; render(); return; }
  if(d.prot!==undefined){ openProtect(d.prot||null); return; }
  if(d.protk){ window.__prot.pick[d.protk]=+d.protv; updProtEx(); return; }
  if(d.protsave){ const P=protectState(), w=window.__prot;
    if(d.protsave==='def') P.def={...w.pick}; if(d.protsave==='one') P.per[w.sym]={...w.pick}; if(d.protsave==='reset') delete P.per[w.sym];
    save(); toast(`🛡 Auto-protect ${d.protsave==='one'?'for '+w.sym:'default'}: ${protLabel(d.protsave==='reset'?P.def:w.pick)}`); render(); if(w.sym) openTrade(w.sym); else closeSheet(); return; }
  if(d.about){ openProfile(d.about); return; }
  if(d.lots){ openLots(d.lots); return; }
  if(d.lotmax!==undefined){ const i=+d.lotmax, l=S.holdings[$('[data-lotsell]').dataset.sym2].lots[i]; $('#lq'+i).value=l.left; return; }
  if(d.lotsell!==undefined){ const i=+d.lotsell, sym=d.sym2, q=Math.floor(+$('#lq'+i).value||0), l=S.holdings[sym]?.lots[i]; if(!l||q<1) return toast('Enter how many shares to sell'); const n=Math.min(q,l.left); trade(sym,n,'sell',[{i,qty:n}]); return; }
  if(d.pkmax!==undefined){ const inp=document.querySelector(`.pk[data-i="${d.pkmax}"]`); inp.value=inp.dataset.max; updPicker(); return; }
  if(t.id==='pkGo'){ const sym=d.sym2, alloc=[]; document.querySelectorAll('.pk').forEach(inp=>{ const v=Math.min(Math.floor(+inp.value||0),+inp.dataset.max); if(v>0) alloc.push({i:+inp.dataset.i,qty:v}); }); const tot=alloc.reduce((a,b)=>a+b.qty,0); if(tot) trade(sym,tot,'sell',alloc); return; }
  if(d.art){ openArticle(d.art); return; }
  if(d.tmode){ tradeMode=d.tmode; if(d.tmode==='plan') orderType=isOpen()?'limit':'obuy'; openTrade(sheetSym); return; }
  if(d.otype){ orderType=d.otype; openTrade(sheetSym); return; }
  if(d.pp){ const s=stock(sheetSym); $('#op').value=(s.price*(1+d.pp/100)).toFixed(2); updEst(); return; }
  if(d.cancel){ cancelOrder(d.cancel); return; }
  if(t.id==='placeB'){ placeOrder(); return; }
  if(d.tab){ tab=d.tab; render(); window.scrollTo(0,0); return; }
  if(d.npc){ $('#q')&&($('#q').value=''); openNpc(d.npc); return; }
  if(d.goal){ buyItem(d.goal); return; }
  if(d.borrow){ borrow(+d.borrow); return; }
  if(d.repay){ repay(+d.repay); return; }
  if(d.buyprop){ buyProp(d.buyprop); return; }
  if(d.sellprop){ sellProp(d.sellprop); return; }
  if(d.sym && (!t.closest('#sheet')||d.from==='art')){ if(!t.closest('#sheet')) swipeList = (tab==='portfolio' && S.holdings[d.sym]) ? Object.keys(S.holdings) : null; $('#q')&&($('#q').value=''); tradeMode='now'; orderType=isOpen()?'limit':'obuy'; openTrade(d.sym); return; }
  if(d.q){ const q=$('#q'); q.value=Math.max(1,(Math.floor(+q.value)||0)+(+d.q)); updEst(); return; }
  if(d.qadd){ const q=$('#q'); q.value=(Math.floor(+q.value)||0)+(+d.qadd); updEst(); return; }
  if(d.qset!==undefined){ const s=stock(sheetSym), v=d.qset; $('#q').value=v==='maxbuy'?maxBuyAvail(s, ($('#op')&&OTYPES[orderType].price&&$('#placeB'))?+$('#op').value:s.price):v==='all'?(S.holdings[s.sym]?.qty||0):v; updEst(); return; }
  if(t.id==='buyB'){ trade(sheetSym,+$('#q').value,'buy'); return; }
  if(t.id==='sellB'){ const hh=S.holdings[sheetSym], q=Math.floor(+$('#q').value||0); if(hh && ensureLots(hh).lots.filter(l=>l.left).length>1){ openLotsPicker(sheetSym,q); return; } trade(sheetSym,q,'sell'); return; }
  const a=d.act;
  if(a==='close') closeSheet();
  if(a==='ack'){ S.queue.shift(); save(); render(); if(S.over) showEnd(); else showQueue(); }
  if(a==='howto') showHowTo();
  if(a==='startplay'){ S.intro=false; save(); closeSheet(); }
  if(a==='reset') confirmReset();
  if(a==='storyskip'){ showStory(STORY.length-1); }
  if(a==='tutstart'){ finishStory(); closeSheet(); startTutorial(); }
  if(a==='tutno'){ finishStory(); closeSheet(); render(); toast('Tap 🔔 Open the market when you’re ready!'); }
  if(a==='story'){ showStory(0); }
  if(a==='tutorial'){ closeSheet(); startTutorial(); }
  if(a==='newgame'){ stopTimer(); newGame(); morningRead(); S.intro=false; S.storySeen=true; tab='market'; closeSheet(); render(); toast('New game — good luck!'); }
  if(a==='read') freeRead();
  if(a==='read2'){ freeRead(true); sfx('click'); }
  if(a==='dinner') dinner();
  if(a==='bet'){ closeSheet(); S.queue.push({type:'event',id:'bet',d:EVENTS.bet.data()}); save(); showQueue(); }
  if(a==='lastrep'){ showReport(S.lastReport,false); }
  if(a==='lastweek'){ showWeek(S.lastWeek,false); }
  if(a==='togrep'){ S.showReport=S.showReport===false; save(); render(); }
  if(a==='autopause'){ S.autoPause=S.autoPause===false; save(); render(); }
  if(a==='sound'){ S.sound=!S.sound; save(); render(); sfx('click'); }
});
// touch swipe on the trade screen
(()=>{ let x0=0,y0=0,t0=0;
  $('#sheet').addEventListener('touchstart',e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); },{passive:true});
  $('#sheet').addEventListener('touchend',e=>{
    if(!sheetSym||tutOn||e.target.closest('input,select,.chips,.otypes')) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)>60 && Math.abs(dy)<Math.abs(dx)*.6 && Date.now()-t0<800) swipeTo(dx<0?1:-1);
  },{passive:true});
  document.addEventListener('keydown',e=>{ if(!sheetSym||e.target.closest('input')) return; if(e.key==='ArrowRight') swipeTo(1); if(e.key==='ArrowLeft') swipeTo(-1); });
})();
document.addEventListener('input',e=>{ if(e.target.id==='q'||e.target.id==='op') updEst(); if(e.target.classList.contains('pk')) updPicker(); });
document.addEventListener('change',e=>{ if(e.target.id==='olot') orderLot=e.target.value; });
$('#openBtn').addEventListener('click',()=>{ if(S.queue.length) showQueue(); else if(isOpen()) skipToClose(); else goMidday(); });
$('#ffBtn').addEventListener('click',fastForward);
$('#pauseBtn').addEventListener('click',()=>{ paused=!paused; S.breakPaused=false; render(); });
$('#speedBtn').addEventListener('click',()=>{ speed=speed===1?2:speed===2?4:1; if(isOpen()) startTimer(); controls(); });
$('#skipBtn').addEventListener('click',skipToClose);

// ================= BOOT =================
if(!load()) newGame();
morningRead();
// keep each company's market sensitivity in line with its profile (older saves used random values)
S.stocks.forEach(s=>{ const P=PROFILES[s.sym]; if(P && !s.betaFixed){ s.beta=P.beta*rnd(.9,1.1); s.betaFixed=true; } });
// switch saves from the old 1,095-day count to trading days
if(!S.cal){
  const cv=d=>typeof d==='number'&&d>=0?tradingIndexByCal(d):d;
  S.day=cv(S.day); ['martyBan','lastEvent','tipDay','readDay','dinnerDay'].forEach(k=>S[k]=cv(S[k]));
  (S.pending||[]).forEach(p=>p.day=cv(p.day)); (S.log||[]).forEach(l=>l.day=cv(l.day));
  if(S.seen&&S.seen.galaDay) S.seen.galaDay=cv(S.seen.galaDay);
  Object.values(S.holdings||{}).forEach(hh=>{ (hh.lots||[]).forEach(l=>l.day=cv(l.day)); (hh.sells||[]).forEach(x=>x.day=cv(x.day)); });
  if(S.lastReport) S.lastReport.day=cv(S.lastReport.day);
  S.cal=true;
}
// v7: scaled-down endgame (island $8M); update unowned listings
if(!S.v8){ (S.props||[]).forEach(p=>{ const d=PROPS.find(x=>x.id===p.id); if(d && !p.owned && (p.id==='lake'||p.id==='estate')) p.value=d.price; }); S.v7=true; S.v8=true; }
// v5 rebalance: calmer daily swings and a real upward drift for games saved before the update
S.stocks.forEach(s=>{ if(!s.v9){ const c=COMPANIES.find(x=>x[0]===s.sym); if(c) s.vol=c[4]; s.v9=true; s.v6=true; s.v5=true; } });
S.stocks.forEach(s=>{ if(!s.v6){ const c=COMPANIES.find(x=>x[0]===s.sym); if(c) s.vol=c[4]; s.drift=rnd(.0006,.0013); s.v6=true; s.v5=true; } });
S.stocks.forEach(s=>{ if(!s.v5){ const c=COMPANIES.find(x=>x[0]===s.sym); if(c) s.vol=c[4]; s.drift=rnd(.0006,.0013); s.v5=true; } });
render();
if(isOpen()){ paused=true; while(S.t<MID) stepTick(); filledSyms.clear(); save(); render(); }
if(!S.storySeen){ paused=true; showStory(0); } else if(S.over) showEnd(); else if(S.queue.length) showQueue();

</script>
</body>
</html>
